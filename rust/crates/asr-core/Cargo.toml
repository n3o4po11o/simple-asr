[package]
name = "asr-core"
description = "Model download/cache, audio decode + resample, settings for simple-asr"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json", "socks"] }
rubato = "0.16"
serde.workspace = true
serde_json.workspace = true
symphonia = { version = "0.5", default-features = false, features = ["wav", "pcm", "mp3", "aac", "isomp4", "flac", "ogg", "vorbis", "adpcm", "aiff", "caf"] }
thiserror.workspace = true
# sherpa 分离模型（pyannote 分割）经 tar.bz2 分发，纯 Rust 解压
tar = "0.4"
bzip2-rs = "0.1"

[dependencies.regex]
version = "1"

[dev-dependencies]
tempfile = "3"
