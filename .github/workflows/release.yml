# 发布构建：Linux(Vulkan) AppImage + macOS(Metal) .app + Windows(Vulkan) zip
# → GitHub Release
#
# 触发方式：
#   1. 推 v* 标签：构建并创建 Release（标签即版本号，如 v0.1.0）
#   2. workflow_dispatch：只构建（产物在 run 的 Artifacts，验证用）；
#      勾选 publish 并填 tag 则同时发布 Release
#
# 兼容性取向（老系统优先）：
#   Linux 在 Ubuntu 24.04 (glibc 2.39) 容器构建。曾用 Debian 12（glibc 2.36
#   基线更低），但其工具链给引擎埋了两颗雷（bazzite/RADV 9070 XT 实测）：
#   ① glslc(glslang 11) 编不了 coopmat/bf16/int8 GLSL 扩展——GGML_VULKAN_
#   *_GLSLC_SUPPORT 全部探测失败，这些 shader 与代码路径在构建期被整体裁掉
#   （同机 Fedora 构建为 bf16:1/coopmat，Debian 构建为 0/none），性能只剩
#   零头且无 coopmat 回退路径崩溃（空函数指针段错误）；② 老 libvulkan
#   loader(1.3.239) 撞新 ICD 把可恢复失败放大成 abort（已另行用
#   --exclude-library 阻止 loader 进包）。Ubuntu 24.04：glslc=shaderc 2023.8
#   (glslang 14)、clang 18。glibc 基线从 2.36 抬到 2.39（Debian 12 /
#   Ubuntu 22.04 宿主不再受支持）。--native-cpu OFF 保证产物不依赖 CI 机器
#   的 AVX-512 等新指令集。
#   macOS 在 macOS 14 镜像 + Xcode 16.2（该镜像最新）构建，部署目标 13.3，
#   产物可运行于 macOS 13.3+（含 Intel? 否——仅 arm64，与本地构建一致）。
#   Windows 在 windows-latest（VS2022 + Vulkan SDK 1.4.341 静默装）构建，
#   引擎 Vulkan 主路径（audio.cpp df6e948 即为 Windows Vulkan 支持 pin 的
#   版本）+ CPU 兜底。无真实 Windows 硬件——产物标「未在真实硬件验证」，
#   构建脚本首次按 CI 日志迭代（AGENTS.md 纪律）。
#
# 引擎静态库进 cdylib 的硬要求经 CFLAGS/CXXFLAGS 传入：
#   -fPIC -ftls-model=global-dynamic（AGENTS.md §7）。

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: '构建后发布到 GitHub Release'
        type: boolean
        default: false
      tag:
        description: 'Release 标签（勾选 publish 时必填，如 v0.1.0）'
        type: string
        default: ''

env:
  FLUTTER_VERSION: 3.44.8
  # 引擎构建树：与 audiocpp-ffi build.rs 默认路径/本地构建一致
  AUDIOCPP_MODELS: qwen3_asr;sortformer_diar;qwen3_forced_aligner

permissions:
  contents: read

jobs:
  # 先建好空 Release（删残留 + --verify-tag 绑定现有 tag；此前多轮
  # tag 重建积累的孤儿 draft 会让发布卡死）。构建作业直接把产物挂上来，
  # 不再经 actions artifact 服务中转——该服务持续 503
  prepare-release:
    name: 准备 Release
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euxo pipefail
          for i in 1 2 3 4 5; do
            if gh release delete "$TAG" --yes --repo "${{ github.repository }}" >/dev/null 2>&1; then break; fi
            [ "$i" = 5 ] || { sleep 15; continue; }
          done
          for i in 1 2 3 4 5; do
            if gh release create "$TAG" --verify-tag --title "$TAG" \
                --generate-notes --repo "${{ github.repository }}"; then
              break
            fi
            [ "$i" = 5 ] && exit 1
            echo "release 创建失败（第 $i 轮），15s 后重试"
            sleep 15
          done
          gh release view "$TAG" --repo "${{ github.repository }}" \
            --json url,isDraft -q '"draft=\(.isDraft) \(.url)"'

  build-linux:
    name: Linux AppImage（Vulkan 引擎）
    needs: prepare-release
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    timeout-minutes: 120
    permissions:
      contents: write
    # 容器作业的默认 shell 是 sh(dash)：pipefail、${var:0:N} 等 bash 语法
    # 会在第 1 行就 "Illegal option"（exit 2）——统一显式 bash
    defaults:
      run:
        shell: bash
    env:
      # 官方源（脚本默认中国镜像，CI 在海外反而慢）
      FLUTTER_STORAGE_BASE_URL: https://storage.googleapis.com
      PUB_HOSTED_URL: https://pub.dev
    steps:
      - name: 安装构建依赖
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            ca-certificates curl git xz-utils bzip2 unzip file sudo \
            build-essential \
            clang libomp-18-dev \
            cmake ninja-build pkg-config \
            libgtk-3-dev libglib2.0-dev libpcre2-dev \
            libvulkan-dev glslc spirv-headers \
            libmpv2 desktop-file-utils
      - name: Rust 工具链（cargokit 要求 rustup）
        run: |
          command -v rustup >/dev/null 2>&1 || \
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      # Ubuntu 24.04 的 vulkan 头文件是 1.3.277（VK_EXT_layer_settings 有了，
      # ≥1.3.274 即可），但引擎 bf16 能力门控依赖 VK_KHR_shader_bfloat16——
      # 2025 年扩展，需 1.4.3xx 头文件——装新版到 /usr/local
      #（cmake 正规安装，产出 VulkanHeadersConfig 供 loader 构建查找）。
      # 共享 runner 出口 IP 会被 GitHub 二级限流（429）——重试 + 全错误退避
      - name: 新版 Vulkan 头文件
        env:
          VULKAN_HEADERS_TAG: vulkan-sdk-1.4.341.0
        run: |
          set -o pipefail
          for i in 1 2 3 4 5; do
            if curl -fsSL --retry 3 --retry-delay 10 --retry-all-errors \
              -o /tmp/vh.tar.gz \
              "https://github.com/KhronosGroup/Vulkan-Headers/archive/refs/tags/${VULKAN_HEADERS_TAG}.tar.gz" 2>&1 | tee /tmp/vh.log; then
              break
            fi
            [ "$i" = 5 ] && exit 1
            echo "vh 下载失败（第 $i 轮），15s 后重试"
            sleep 15
          done
          tar -xzf /tmp/vh.tar.gz -C /tmp
          cmake -S "/tmp/Vulkan-Headers-${VULKAN_HEADERS_TAG}" -B /tmp/vh-build -GNinja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --install /tmp/vh-build
          rm -rf /tmp/vh.tar.gz "/tmp/Vulkan-Headers-${VULKAN_HEADERS_TAG}" /tmp/vh-build
      - uses: actions/checkout@v5

      - name: 构建 audio.cpp 引擎（Vulkan）
        run: |
          set -o pipefail
          bash scripts/fetch-audiocpp.sh 2>&1 | tee /tmp/engine.log
          cd rust/vendor/audiocpp
          # clang 编译（libomp 而非 libgomp，与打包脚本/链接清单一致）+
          # cdylib 硬要求的 PIC/TLS 模型
          env CC=clang CXX=clang++ \
              CFLAGS="-fPIC -ftls-model=global-dynamic" \
              CXXFLAGS="-fPIC -ftls-model=global-dynamic" \
            bash scripts/build_linux.sh --backend vulkan --deployment-build \
              --model-set custom --models "$AUDIOCPP_MODELS" \
              --native-cpu OFF --target audiocpp_gguf 2>&1 | tee -a /tmp/engine.log
          test -f build/linux-vulkan-release/libengine_runtime.a
          test -x build/linux-vulkan-release/bin/audiocpp_gguf
          # shader 能力探测结果大声上报——缺失=构建工具链无声退化（Debian 12
          # 时代 glslang 11 曾全灭：coopmat/bf16/int8 shader 整体裁掉，性能
          # 剩零头且回退路径崩溃）
          for feat in coopmat bfloat16 dot; do
            if grep -q "Enabling ${feat} glslc support" /tmp/engine.log; then
              echo "::notice::glslc ${feat} 支持 ✓"
            else
              echo "::warning::glslc ${feat} 支持缺失（shader 走回退路径）"
            fi
          done

      - name: sherpa-onnx（说话人分离）
        run: bash scripts/fetch-sherpa-onnx.sh 2>&1 | tee /tmp/sherpa.log

      # 预置 Flutter SDK（官方 release tarball，含 dart-sdk 免 bootstrap 下载
      # ——git clone + 引导下载在 CI 上断流过（curl 中途死、exit 255）；tarball
      # 与 ci.yml 里 subosito 动作同源，路径已验证）。放在脚本预期的
      # .flutter-sdk 位置，脚本检测到即跳过自己的克隆
      - name: 预置 Flutter SDK
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE"
          curl -fsSL --retry 3 --retry-delay 3 --retry-all-errors \
            -o /tmp/flutter.tar.xz \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          tar -xJf /tmp/flutter.tar.xz
          rm -f /tmp/flutter.tar.xz
          mv flutter .flutter-sdk
          # 容器以 root 运行、工作区属主是宿主 uid——git 需要 safe.directory
          git config --global --add safe.directory "$GITHUB_WORKSPACE/.flutter-sdk"
          export PATH="$GITHUB_WORKSPACE/.flutter-sdk/bin:$PATH"
          flutter --version

      # media_kit_libs_linux 插件在 flutter build 配置期自下载 mimalloc
      #（github.com；限流时拿到坏档 → MD5 校验 FATAL_ERROR）。预种正确文件，
      # 插件检测到即跳过下载（MD5 来自其 CMakeLists）
      - name: 预置 mimalloc（插件构建期依赖）
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/app/build/linux/x64/release"
          dest="$GITHUB_WORKSPACE/app/build/linux/x64/release/mimalloc-2.1.2.tar.gz"
          for i in 1 2 3 4 5; do
            if curl -fsSL --retry 3 --retry-delay 10 --retry-all-errors \
              -o "$dest" "https://github.com/microsoft/mimalloc/archive/refs/tags/v2.1.2.tar.gz"; then
              break
            fi
            [ "$i" = 5 ] && exit 1
            echo "mimalloc 下载失败（第 $i 轮），15s 后重试"
            sleep 15
          done
          echo "5179c8f5cf1237d2300e2d8559a7bc55  $dest" | md5sum -c -

      - name: 构建 AppImage
        env:
          AUDIOCPP_SRC: ${{ github.workspace }}/rust/vendor/audiocpp
          AUDIOCPP_BUILD: ${{ github.workspace }}/rust/vendor/audiocpp/build/linux-vulkan-release
          FLUTTER_VERSION: ${{ env.FLUTTER_VERSION }}
          CARGO_MIRROR: none
        run: |
          set -o pipefail
          # libomp 运行库兜底：Debian 把它放 /usr/lib/llvm-*/lib（未必进 ldconfig）
          for f in /usr/lib/llvm-*/lib/libomp*.so*; do
            [ -e "$f" ] && ln -sf "$(readlink -f "$f")" /usr/lib/x86_64-linux-gnu/ || true
          done
          bash scripts/build-linux-appimage.sh 2>&1 | tee /tmp/appimage.log
          ls -la dist/

      # 无 gh CLI/token 时 Actions 日志不可读——每份日志的尾部合并为一条
      # annotation（单步上限 10 条，逐行上报会被引擎构建日志刷满），完整
      # 日志另存工件
      - name: 失败诊断上报
        if: failure()
        run: |
          for log in /tmp/vh.log /tmp/engine.log /tmp/sherpa.log /tmp/appimage.log; do
            [ -f "$log" ] || continue
            echo "===== $log 尾部 ====="
            tail -30 "$log"
            echo "::error::${log} 尾部: $(tail -8 "$log" | tr '\n' '|' | cut -c1-700)"
          done
          ls -la /tmp/*.log 2>/dev/null || true

      - name: 失败日志工件
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-build-logs
          path: /tmp/*.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: simple-asr-linux-x86_64
          path: dist/simple-asr-linux-x86_64.AppImage
          if-no-files-found: error
      # 产物直挂 Release（不经 artifact 服务；该服务持续 503）。ubuntu
      # 容器无 gh CLI——纯 curl 走 REST 上传端点
      - name: 挂到 Release
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'workflow_dispatch' && inputs.publish)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euxo pipefail
          rel_id=""
          for i in 1 2 3 4 5; do
            rel_id=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG" \
              | grep -o '"id": *[0-9]\+' | head -1 | tr -dc '0-9')
            [ -n "$rel_id" ] && break
            [ "$i" = 5 ] && { echo "::error::查询 release id 失败（TAG=$TAG）"; exit 1; }
            echo "查询 release 失败（第 $i 轮），15s 后重试"
            sleep 15
          done
          for i in 1 2 3 4 5; do
            if curl -fsSL -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @dist/simple-asr-linux-x86_64.AppImage \
              "https://uploads.github.com/repos/${{ github.repository }}/releases/$rel_id/assets?name=simple-asr-linux-x86_64.AppImage"; then
              break
            fi
            [ "$i" = 5 ] && { echo "::error::产物上传失败（rel_id=$rel_id）"; exit 1; }
            echo "产物上传失败（第 $i 轮），15s 后重试"
            sleep 15
          done
          echo "::notice::linux 产物已挂载（release $rel_id）"


  build-macos:
    name: macOS .app（Metal 引擎，arm64）
    needs: prepare-release
    runs-on: macos-14
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      # Flutter 走官方 tarball 直连（storage.googleapis.com，与 Linux 作业
      # 同法）：subosito action 经 codeload 下载，共享 runner 出口 IP 被
      # GitHub 二级限流（429）时连 action 都拉不下来
      - name: 预置 Flutter SDK
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE"
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors \
            -o /tmp/flutter.zip \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/flutter_macos_${FLUTTER_VERSION}-stable.zip"
          unzip -q /tmp/flutter.zip -d "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/flutter" .flutter-sdk
          echo "$GITHUB_WORKSPACE/.flutter-sdk/bin" >> "$GITHUB_PATH"
          export PATH="$GITHUB_WORKSPACE/.flutter-sdk/bin:$PATH"
          flutter --version
      # file_selector/url_launcher 的 Package.swift 会被 SPM 分流移出 pods，
      # Podfile 布局随之改变——必须与本地一致关闭（AGENTS.md §7 工具链排障）
      - name: 关闭 Swift Package Manager 分流
        run: flutter config --no-enable-swift-package-manager
      - name: Rust 工具链（cargokit 要求 rustup）
        run: |
          command -v rustup >/dev/null 2>&1 || \
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      # macos-14 镜像默认 Xcode 15.4，装 16.2（该镜像最新；SDK 新但部署目标不变）
      - name: 选择 Xcode 16.2
        run: |
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          fi
          xcodebuild -version

      - name: 构建 audio.cpp 引擎（Metal）
        run: |
          bash scripts/fetch-audiocpp.sh
          cd rust/vendor/audiocpp
          # 部署目标 13.3 与 App/Runner 工程一致（引擎 trace.cpp 需 macOS 13.3）
          bash scripts/build_metal.sh --deployment-build --deployment-target 13.3 \
            --model-set custom --models "$AUDIOCPP_MODELS" \
            --native-cpu OFF --target audiocpp_gguf
          test -f build/macos-metal-release/libengine_runtime.a
          test -x build/macos-metal-release/bin/audiocpp_gguf

      - name: sherpa-onnx（说话人分离）
        run: bash scripts/fetch-sherpa-onnx.sh

      - name: 构建 .app
        run: bash scripts/build_macos.sh

      - name: 打包 zip
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent simple_asr.app simple-asr-macos-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: simple-asr-macos-arm64
          path: dist/simple-asr-macos-arm64.zip
          if-no-files-found: error
      # 产物直挂 Release（不经 artifact 服务）
      - name: 挂到 Release
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'workflow_dispatch' && inputs.publish)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euxo pipefail
          for i in 1 2 3 4 5; do
            if gh release upload "$TAG" dist/simple-asr-macos-arm64.zip \
                --clobber --repo "${{ github.repository }}"; then
              break
            fi
            [ "$i" = 5 ] && exit 1
            sleep 15
          done
          echo "::notice::macos 产物已挂载 $(date -u +%H:%M:%SZ)"

  build-windows:
    name: Windows x64（Vulkan 引擎）
    needs: prepare-release
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      # Flutter 官方 zip 直连（与 Linux/macOS 作业同法，绕开二级限流）
      - name: 预置 Flutter SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dst = "$env:RUNNER_TEMP\flutter.zip"
          curl.exe -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o $dst `
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/windows/flutter_windows_${env:FLUTTER_VERSION}-stable.zip"
          if ($LASTEXITCODE -ne 0) { throw "flutter zip 下载失败" }
          Expand-Archive $dst -DestinationPath $env:RUNNER_TEMP
          Move-Item "$env:RUNNER_TEMP\flutter" "$env:GITHUB_WORKSPACE\.flutter-sdk"
          Add-Content $env:GITHUB_PATH "$env:GITHUB_WORKSPACE\.flutter-sdk\bin"
          & "$env:GITHUB_WORKSPACE\.flutter-sdk\bin\flutter.bat" --version
      # windows-latest 无 rustup（cargokit 要求）
      - name: Rust 工具链
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          curl.exe -fsSL --retry 5 --retry-delay 10 --retry-all-errors `
            -o "$env:RUNNER_TEMP\rustup-init.exe" https://win.rustup.rs/x86_64
          & "$env:RUNNER_TEMP\rustup-init.exe" -y --profile minimal --default-toolchain stable
          if ($LASTEXITCODE -ne 0) { throw "rustup 安装失败" }
          Add-Content $env:GITHUB_PATH "$env:USERPROFILE\.cargo\bin"
      # 引擎 Vulkan 主路径需要 SDK（头文件 + glslc + vulkan-1.lib）。版本化
      # 下载 URL（/download/<ver>/windows/…-Installer.exe）已被 LunarG 废弃
      # （404 实测），改用稳定 latest 端点；2025+ 的 latest 头文件必含
      # VK_KHR_shader_bfloat16（≥1.4.3xx），shaderc 亦为全量探测
      - name: Vulkan SDK（静默安装）
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $inst = "$env:RUNNER_TEMP\vulkan-sdk.exe"
          curl.exe -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o $inst `
            "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-sdk.exe"
          if ($LASTEXITCODE -ne 0) { throw "Vulkan SDK 下载失败" }
          $p = Start-Process -FilePath $inst `
            -ArgumentList "--accept-licenses","--default-answer","--confirm-command","install" `
            -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Vulkan SDK 安装失败 exit=$($p.ExitCode)" }
          $sdk = Get-ChildItem "C:\VulkanSDK" -Directory |
            Sort-Object Name -Descending | Select-Object -First 1
          Write-Host "SDK 版本：$($sdk.Name)"
          Add-Content $env:GITHUB_PATH "$($sdk.FullName)\Bin"
          & "$($sdk.FullName)\Bin\glslc.exe" --version
      # 一体化构建脚本：引擎（上游 build_windows.ps1 自动探测 VS/cl/cmake/
      # ninja）→ sherpa → CAM++ → flutter build windows → 收集 dll → zip。
      # pwsh 直调（脚本带 UTF-8 BOM；Windows PowerShell 5.1 无 BOM 会把
      # 中文按 GBK 读成乱码导致解析失败——v0.1.4 实测）
      - name: 构建（build_windows.ps1）
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & .\scripts\build_windows.ps1 -Backend vulkan
          if ($LASTEXITCODE -ne 0) { throw "build_windows.ps1 失败" }
          Test-Path dist\simple-asr-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: simple-asr-windows-x64
          path: dist/simple-asr-windows-x64.zip
          if-no-files-found: error
      # 产物直挂 Release（windows runner 自带 gh CLI）
      - name: 挂到 Release
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'workflow_dispatch' && inputs.publish)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($i in 1..5) {
            & gh release upload "$env:TAG" dist/simple-asr-windows-x64.zip --clobber --repo "$env:GITHUB_REPOSITORY"
            if ($LASTEXITCODE -eq 0) { break }
            if ($i -eq 5) { throw "release upload 失败" }
            Start-Sleep -Seconds 15
          }
          Write-Host "::notice::windows 产物已挂载"


